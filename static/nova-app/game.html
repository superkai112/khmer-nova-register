<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050812"><title>KHMER NOVA | Battle Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050812;color:#eaf6ff;font:15px Arial,sans-serif;min-height:100vh}header{padding:16px 20px;border-bottom:1px solid #00d9ff40;display:flex;justify-content:space-between}header b{color:#00d9ff;letter-spacing:2px}a{color:#8bdfff;text-decoration:none}main{width:min(900px,100%);padding:18px;margin:auto}h1{font-size:clamp(22px,5vw,34px);color:#00d9ff}p{color:#9bb2ca}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#0c1b2e;padding:12px 15px;border:1px solid #16476a;border-radius:10px;margin:14px 0}canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;background:#071321;border:1px solid #1676a2;border-radius:12px;touch-action:none}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:13px 20px;background:linear-gradient(90deg,#0873d1,#00a9d9);color:white;font-weight:bold;font-size:14px;cursor:pointer}.pad{display:flex;gap:8px;flex-wrap:wrap}.pad button{min-width:48px;padding:13px 15px;background:#12314b;border:1px solid #26749a;touch-action:none}#message{color:#8bdfff;min-height:20px;margin-top:12px;font-size:13px}
</style></head><body><header><b>KHMER NOVA</b><a href="/dashboard">← PLAYER DASHBOARD</a></header><main>
<h1>BATTLE TRAINING</h1><p>Prototype arena • Destroy red drones and survive. This is an early KHMER NOVA demo, not the original ROS game.</p>
<div class="hud"><span>SCORE: <b id="score">0</b></span><span>HEALTH: <b id="health">100</b></span><span>DRONES: <b id="left">0</b></span></div>
<canvas id="arena" width="960" height="600" aria-label="Battle training game"></canvas>
<div class="controls"><div class="pad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><button id="start">START / RESTART</button><button id="fire">FIRE</button></div>
<div id="message">Tap START. Move with the arrows; aim with touch and fire with FIRE.</div></main>
<script>
const c=document.getElementById('arena'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let player={x:480,y:300,r:17,hp:100},enemies=[],bullets=[],score=0,running=false,last=0,keys={},aim={x:700,y:300},spawn=0;
function hud(){$('score').textContent=score;$('health').textContent=Math.max(0,Math.ceil(player.hp));$('left').textContent=enemies.length}
function reset(){player={x:480,y:300,r:17,hp:100};enemies=[];bullets=[];score=0;spawn=0;running=true;last=0;$('message').textContent='Survive as long as you can!';hud();requestAnimationFrame(loop)}
function drone(){let side=Math.floor(Math.random()*4),x=side===0?0:side===1?960:Math.random()*960,y=side===2?0:side===3?600:Math.random()*600;enemies.push({x,y,r:15,hp:2,speed:65+Math.random()*35})}
function shoot(){if(!running)return;let dx=aim.x-player.x,dy=aim.y-player.y,d=Math.hypot(dx,dy)||1;bullets.push({x:player.x,y:player.y,vx:dx/d*470,vy:dy/d*470,r:5})}
function draw(){ctx.clearRect(0,0,960,600);ctx.strokeStyle='#102b40';for(let x=0;x<960;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke()}for(let y=0;y<600;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}ctx.fillStyle='#00d9ff';ctx.shadowColor='#00d9ff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff4968';for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffe36e';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000||0,.04);last=t;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(18,Math.min(942,player.x+dx/len*230*dt));player.y=Math.max(18,Math.min(582,player.y+dy/len*230*dt));spawn+=dt;if(spawn>1.35){drone();spawn=0}for(const e of enemies){let x=player.x-e.x,y=player.y-e.y,d=Math.hypot(x,y)||1;e.x+=x/d*e.speed*dt;e.y+=y/d*e.speed*dt;if(d<player.r+e.r)player.hp-=22*dt}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r&&e.hp>0){e.hp=0;b.dead=true;score+=10}}}bullets=bullets.filter(b=>!b.dead&&b.x>-10&&b.x<970&&b.y>-10&&b.y<610);enemies=enemies.filter(e=>e.hp>0);hud();draw();if(player.hp<=0){running=false;$('message').textContent='GAME OVER — Score: '+score+'. Tap START / RESTART.';return}requestAnimationFrame(loop)}
function point(e){const r=c.getBoundingClientRect();aim.x=(e.clientX-r.left)*960/r.width;aim.y=(e.clientY-r.top)*600/r.height}c.addEventListener('pointermove',point);c.addEventListener('pointerdown',e=>{point(e);shoot()});$('fire').onclick=shoot;$('start').onclick=reset;
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=true;if(k==='arrowdown'||k==='s')keys.down=true;if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' ')shoot()});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.down=false;if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});draw();hud();
</script></body></html>
