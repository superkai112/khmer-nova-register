<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061426"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KHMER NOVA"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>KHMER NOVA</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#16466f,#071426 55%,#020711);color:#effaff;font-family:Arial,sans-serif}.wrap{width:min(100%,440px)}header{text-align:center;margin-bottom:22px}.logo{margin:auto;width:76px;height:76px;border:2px solid #42dcff;border-radius:20px;display:grid;place-items:center;color:#42dcff;font-size:28px;font-weight:900;box-shadow:0 0 28px #18bff966}h1{letter-spacing:4px;text-shadow:0 0 20px #25caff88}.tag{font-size:11px;letter-spacing:3px;color:#82dfff}.panel{background:#091a2df2;border:1px solid #1d789b;border-radius:18px;padding:24px;box-shadow:0 18px 60px #0009}.tabs{display:flex;gap:8px}.tabs button,.show,.logout{cursor:pointer;background:#102b44;color:#aeeaff;border:1px solid #24516d;border-radius:9px;padding:12px}.tabs button{flex:1;font-weight:bold}.tabs .active{border-color:#42dcff;background:#073d59;color:white}label{display:block;margin:16px 0 7px;color:#a9d8ed;font-size:12px}input{width:100%;padding:14px;border-radius:9px;border:1px solid #28516d;background:#061321;color:white;font-size:16px}.pw{display:flex;gap:7px}.pw input{flex:1}.submit{width:100%;margin-top:21px;padding:15px;border:0;border-radius:9px;background:linear-gradient(100deg,#087bc2,#11c6e8);color:#001522;font-weight:900;letter-spacing:1px;cursor:pointer}.submit:disabled{opacity:.5}.msg{min-height:24px;margin-top:13px;color:#9feaff;font-size:14px}.err{color:#ff9eaa}.hidden{display:none}.home{text-align:center}.home h2{color:#42dcff}.foot{text-align:center;color:#6687a0;font-size:11px;margin-top:18px;letter-spacing:1px}
</style></head><body><main class="wrap"><header><div class="logo">KN</div><h1>KHMER NOVA</h1><div class="tag">INDEPENDENT PLAYER ACCESS</div></header>
<section class="panel" id="auth"><div class="tabs"><button id="lt" class="active" type="button">LOG IN</button><button id="rt" type="button">REGISTER</button></div><form id="form"><label>USERNAME OR EMAIL</label><input id="username" autocomplete="username" required placeholder="Enter username or email"><div id="eg" class="hidden"><label>EMAIL ADDRESS</label><input id="email" type="email" placeholder="you@example.com"></div><label>PASSWORD</label><div class="pw"><input id="password" type="password" required autocomplete="current-password" placeholder="Enter password"><button class="show" type="button" data-id="password">SHOW</button></div><div id="cg" class="hidden"><label>CONFIRM PASSWORD</label><div class="pw"><input id="confirm" type="password" placeholder="Repeat password"><button class="show" type="button" data-id="confirm">SHOW</button></div></div><button class="submit" id="submit">ENTER KHMER NOVA</button><div class="msg" id="msg" role="status"></div></form></section>
<section class="panel home hidden" id="home"><h2>WELCOME TO KHMER NOVA</h2><p id="welcome"></p><p>You are signed in to your KHMER NOVA account.</p><button class="logout" id="out">LOG OUT</button></section><div class="foot">KHMER NOVA • COMMUNITY ACCOUNT PORTAL</div></main>
<script>
const API='https://khmer-nova-backend.onrender.com';const $=x=>document.getElementById(x);let mode='login';
function setMode(m){mode=m;$('lt').classList.toggle('active',m==='login');$('rt').classList.toggle('active',m==='register');$('eg').classList.toggle('hidden',m!=='register');$('cg').classList.toggle('hidden',m!=='register');$('submit').textContent=m==='login'?'ENTER KHMER NOVA':'CREATE ACCOUNT';$('msg').textContent='';}
$('lt').onclick=()=>setMode('login');$('rt').onclick=()=>setMode('register');
document.querySelectorAll('.show').forEach(b=>b.onclick=()=>{let x=$(b.dataset.id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'SHOW':'HIDE';});
$('form').onsubmit=async e=>{e.preventDefault();let username=$('username').value.trim(),password=$('password').value;if(mode==='register'){if(!/^[A-Za-z0-9_]{3,24}$/.test(username))return $('msg').textContent='Username must be 3–24 letters, numbers or underscores.';if(password.length<10)return $('msg').textContent='Password must be at least 10 characters.';if(password!==$('confirm').value)return $('msg').textContent='Passwords do not match.';if(!$('email').value.trim())return $('msg').textContent='Enter your email address.';}
let b=$('submit');b.disabled=true;$('msg').textContent='Connecting…';try{let path=mode==='register'?'/api/register':'/api/login';let body=mode==='register'?{username,email:$('email').value.trim(),password,confirm:$('confirm').value}:{username,password};let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});let d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Request failed');if(mode==='register'){setMode('login');$('username').value=username;$('msg').textContent=d.message||'Account created. Please log in.';}else{$('auth').classList.add('hidden');$('home').classList.remove('hidden');$('welcome').textContent='Welcome, '+(d.username||username)+'!';}}catch(x){$('msg').textContent=x.message;$('msg').classList.add('err');}finally{b.disabled=false;}};
$('out').onclick=async()=>{try{await fetch(API+'/api/logout',{method:'POST',credentials:'include'});}catch(e){}$('home').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value='';$('msg').textContent='Logged out.';};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
